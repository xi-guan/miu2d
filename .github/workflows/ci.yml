name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: tsc / lint / test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # generate-only; nothing in CI ever connects to a database
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      # node stays the runtime for vite/tsc/vitest; bun is the package manager
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/engine-wasm
      - run: bun install --frozen-lockfile
      - run: bun run build:wasm
      - run: bun run --filter=@miu2d/types build
      - run: bun run --filter=@miu2d/server db:generate
      - run: bun run --filter=@miu2d/server gen:trpc
      - run: bun run tsc
      - run: bun run lint
      - run: bun run --filter=@miu2d/engine test

  converter:
    name: cargo check (converter)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/converter
      - run: cargo check --manifest-path packages/converter/Cargo.toml --all-targets
