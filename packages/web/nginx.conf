server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;
    gzip_min_length 1000;

    # 三个游戏的素材直供：DB 里已无 file 记录（yueying 的 14445 条于 2026-07-19 删除），
    # 后端本来也是读同一份磁盘。未命中（大小写不符、msf/→mpc/ 改写）回落 @backend，
    # 行为与直连后端一致
    location ~ ^/game/(sword1|sword2|yueying)/resources/(.+)$ {
        root /assets;
        try_files /$1/$2 @backend;
        # 对齐后端 ASSET_CACHE_MAX_AGE 默认值；别用 immutable —— msf 还在反复重转
        add_header Cache-Control "public, max-age=86400";
    }

    location @backend {
        set $upstream http://server:4000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API 和资源代理到后端（必须在静态资源缓存规则之前，否则 .jpg 等会被静态规则拦截）
    location ~ ^/game/[^/]+/(api|resources)/ {
        set $upstream http://server:4000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Service Worker 不能缓存，否则浏览器检测不到新版本
    location ~* (^/sw\.js$|^/workbox-[^/]+\.js$) {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # tRPC API 代理
    location /trpc/ {
        set $upstream http://server:4000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # SPA 路由 - 所有其他请求返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
