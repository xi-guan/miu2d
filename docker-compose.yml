services:
  # PostgreSQL 数据库
  db:
    image: postgres:17-alpine
    container_name: miu2d-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-miu2d_db}
    ports:
      - "5533:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RustFS 文件存储 (S3 兼容, 替代已归档的 MinIO)
  rustfs:
    image: rustfs/rustfs:1.0.0-beta.8
    container_name: miu2d-rustfs
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio123}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9110:9000"   # API
      - "9101:9001"   # Console
    volumes:
      - ./.data/rustfs:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端服务 (生产环境用)
  server:
    image: miu2d-server:latest
    container_name: miu2d-server
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-miu2d_db}
      NODE_ENV: production
      PORT: 4000
      S3_ENDPOINT: http://rustfs:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
      MINIO_BUCKET: ${MINIO_BUCKET:-miu2d}
    ports:
      - "4100:4000"
    volumes:
      # sword1/sword2 走磁盘回退 (yueying 走 RustFS); RESOURCE_ROOT 在容器内解析到 /app/resources
      - ./resources:/app/resources:ro
    depends_on:
      db:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    profiles:
      - production

  # 前端服务 (生产环境用)
  web:
    image: miu2d-web:latest
    container_name: miu2d-web
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - server
    networks:
      - app-network
    restart: unless-stopped
    profiles:
      - production

networks:
  app-network:
    driver: bridge
